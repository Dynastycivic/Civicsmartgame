<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Civic Smart Game</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f4ef;--ink:#12302e;--card:#10353a;--cardink:#f4fbf8;--acc:#ff8a3d;--acc2:#ffc233;--mut:#9fc7c0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1d1f;--ink:#e8f6f1}}
:root[data-theme="dark"]{--bg:#0b1d1f;--ink:#e8f6f1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:460px;padding:10px}
.stage{position:relative;height:min(76vh,780px);border-radius:22px;overflow:hidden;background:#0b2a2e;border:3px solid var(--card)}
canvas{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:8px;right:8px;top:8px;pointer-events:none;color:var(--cardink)}
.row{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1rem;text-shadow:0 1px 3px #000}
.qc{margin-top:6px;background:rgba(10,38,42,.88);border:2px solid #2c6b6a;border-radius:14px;padding:8px 10px;font-size:.92rem;line-height:1.25;font-weight:600}
.qc b{display:block;color:var(--acc2);font-size:.75rem}
.op{display:flex;gap:6px;margin-top:6px}
.op span{flex:1;border-radius:9px;padding:4px 6px;font-size:.74rem;line-height:1.15;font-weight:600;color:#fff}
.fb{margin-top:6px;border-radius:12px;padding:6px 10px;font-size:.82rem;line-height:1.25;background:rgba(0,0,0,.65)}
.fb.ok{border-left:5px solid #4cd07d}.fb.no{border-left:5px solid #ff6b6b}
.ov{position:absolute;inset:0;background:rgba(7,28,31,.93);color:var(--cardink);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:18px;gap:8px}
.ov[hidden]{display:none}
.ov h1{margin:0;font-size:clamp(2.2rem,11vw,3.2rem);font-weight:800;line-height:1;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ov p{margin:0;color:var(--mut);font-size:.95rem}
.seg{display:flex;gap:6px;width:100%}
.seg button,select{flex:1;font:700 .95rem 'Baloo 2',sans-serif;padding:8px 4px;border-radius:12px;border:2px solid #2c6b6a;background:#12424a;color:var(--cardink);cursor:pointer}
.seg button.on{background:var(--acc);border-color:var(--acc2);color:#2a1300}
select{width:100%;flex:none}
.go{font:800 1.2rem 'Baloo 2',sans-serif;width:100%;padding:12px;border:0;border-radius:16px;background:linear-gradient(var(--acc2),var(--acc));color:#2a1300;cursor:pointer;box-shadow:0 5px 0 #a34a10}
.go.sec{background:#12424a;color:var(--cardink);box-shadow:0 5px 0 #08262b}
.big{font-size:3rem;font-weight:800;color:var(--acc2);line-height:1}
button:focus-visible,select:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.pad{display:flex;gap:8px;margin-top:10px}
.pad button{flex:1;height:54px;font-size:1.5rem;border-radius:16px;border:0;background:var(--card);color:var(--cardink);box-shadow:0 4px 0 #061b1e;cursor:pointer;touch-action:manipulation}
.pad button:active{transform:translateY(3px)}
.tip{font-size:.8rem;text-align:center;margin:8px 0 0;opacity:.75}
</style>
</head>
<body>
<div class="app">
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="hud" hidden>
    <div class="row"><span id="sc">0</span><span id="pg"></span><span id="hp"></span></div>
    <div class="qc" id="qc"></div>
    <div id="fb"></div>
  </div>
  <div class="ov" id="menu">
    <h1>CIVIC SMART<br>GAME</h1>
    <p>Berlari, memilih jalur, dan menjawab di gerbang soal.</p>
    <select id="selSila" aria-label="Pilih sila">
      <option value="0">Semua sila (15 soal)</option><option value="1">Sila 1: Ketuhanan (3 soal)</option><option value="2">Sila 2: Kemanusiaan (3 soal)</option><option value="3">Sila 3: Persatuan (3 soal)</option><option value="4">Sila 4: Musyawarah (3 soal)</option><option value="5">Sila 5: Keadilan (3 soal)</option>
    </select>
    <div class="seg" id="seg"><button data-i="0">Mudah<br><small>10 detik</small></button><button data-i="1" class="on">Sedang<br><small>7 detik</small></button><button data-i="2">Susah<br><small>5 detik</small></button></div>
    <button class="go" id="start">MULAI LARI</button>
    <p id="bestTxt"></p>
    <p style="font-size:.8rem">Panah kiri/kanan atau A/D pindah jalur. Panah atas, W, atau Spasi untuk lompat. Di HP: geser layar atau pakai tombol.</p>
  </div>
  <div class="ov" id="res" hidden>
    <h1 id="rT" style="font-size:2.2rem"></h1>
    <div class="big" id="rS"></div>
    <p id="rI"></p><p id="rC" style="color:var(--acc2);font-weight:800;font-size:1.2rem"></p>
    <button class="go" id="again">MAIN LAGI</button>
    <button class="go sec" id="toMenu">MENU</button>
  </div>
</div>
<div class="pad"><button id="bL" aria-label="Kiri">◀</button><button id="bJ" aria-label="Lompat">▲</button><button id="bR" aria-label="Kanan">▶</button></div>
<p class="tip">Rintangan merah: lompati. Koin: +10. Salah jawab atau menabrak: nyawa berkurang.</p>
</div>
<script>
const $=id=>document.getElementById(id);
const Q=[
[1,"Temanmu sedang beribadah. Sikap yang tepat?",["Bermain keras di dekatnya","Menjaga suasana tetap tenang","Menertawakannya"],1,"Menghormati orang yang beribadah adalah toleransi."],
[1,"Kebebasan beragama berarti...",["Setiap orang bebas beribadah sesuai keyakinannya","Semua wajib satu agama","Agama tidak boleh dibahas"],0,"UUD 1945 Pasal 29 menjamin kebebasan beribadah."],
[1,"Tetangga beda agama merayakan hari raya. Kamu...",["Melarangnya","Mengucapkan selamat dan menghormati","Mengejeknya"],1,"Saling menghormati menjaga kerukunan."],
[2,"Temanmu dibully karena fisiknya. Kamu...",["Ikut tertawa","Membela dan melapor ke guru","Merekamnya"],1,"Empati menghentikan perundungan."],
[2,"Sikap beradab terhadap teman beda suku...",["Memilih teman sesuku","Memperlakukan setara dan sopan","Mengejek logatnya"],1,"Beradab berarti menghargai semua orang."],
[2,"Terjadi bencana di daerah lain. Kamu...",["Menggalang bantuan lewat lembaga terpercaya","Menyebar kabar belum jelas","Mengabaikannya"],0,"Solidaritas diwujudkan lewat bantuan nyata."],
[3,"Bhinneka Tunggal Ika berarti...",["Semua harus sama","Berbeda-beda tetapi tetap satu","Hanya satu suku"],1,"Keberagaman adalah kekuatan bangsa."],
[3,"Kelompok belajarmu berisi teman beda daerah. Kamu...",["Memilih yang sedaerah saja","Menghargai perbedaan dan bekerja sama","Bekerja sendiri"],1,"Kerja sama memperkuat persatuan."],
[3,"Dua kelas berselisih usai pertandingan. Kamu...",["Memanas-manasi","Memusuhi kelas lain","Mengajak berdamai"],2,"Persatuan dijaga dengan damai dan sportif."],
[4,"Hasil pemilihan ketua kelas tak sesuai pilihanmu. Kamu...",["Menerima dan mendukung ketua terpilih","Memboikot kelas","Menjelekkan ketua"],0,"Demokrasi menghormati keputusan bersama."],
[4,"Cara utama menyelesaikan beda pendapat...",["Adu kuat","Keputusan satu orang","Musyawarah untuk mufakat"],2,"Sila keempat mengutamakan musyawarah."],
[4,"Temanmu berbeda pendapat saat rapat. Kamu...",["Memotong ucapannya","Mendengarkan lalu menanggapi sopan","Mengabaikannya"],1,"Menghargai pendapat adalah dasar musyawarah."],
[5,"Temanmu sering tidak piket. Sikap adil?",["Ikut tidak piket","Mengingatkan dan membagi tugas adil","Memarahinya kasar"],1,"Adil berarti hak dan kewajiban seimbang."],
[5,"Teman kurang mampu kesulitan membeli buku. Kamu...",["Meminjamkan atau berbagi buku","Memamerkan buku baru","Mengejeknya"],0,"Berbagi mewujudkan keadilan sosial."],
[5,"Warga mengadakan kerja bakti. Sikapmu?",["Hanya menonton","Meminta dibayar","Ikut serta sesuai kemampuan"],2,"Gotong royong menumbuhkan kebersamaan."]];
const SK=[['#7fd3f0','#fbe7b2'],['#7fd3f0','#fbe7b2'],['#f7a8b8','#ffe3c4'],['#ffb36b','#ffe9a8'],['#8fc7ff','#d9f2d0'],['#a6e3b8','#f4f9c4']];
const LC=['#2f7de1','#2fa84f','#e8702a'],LT=['A','B','C'];
const NEAR=30,FAR=420,PD=7.5,GAP=520;
const cv=$('cv'),cx=cv.getContext('2d');let W=300,H=500,diff=1,sel=0,G=null,mode='menu',last=0,qShown=-1;
let best=0;try{best=+localStorage.getItem('pancasilaRunBest')||0}catch(e){}
let AC=null;
function sfx(f,d,t,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.08,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function tune(a,t){a.forEach((f,i)=>setTimeout(()=>sfx(f,.16,t||'square',.06),i*120))}
function fit(){const r=cv.parentElement.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);
const hs=i=>Math.abs(Math.sin(i*127.1)*43758.5)%1;
const sc=d=>NEAR/(d+NEAR),HOR=()=>H*.3,gy=s=>HOR()+(H-HOR())*s,lx=(l,s)=>W/2+l*(W*.6*s*2/3);
function begin(){
  const qs=sel?Q.filter(q=>q[0]===sel):Q.slice();
  G={dist:0,speed:[40,55,75][diff],lane:0,lx:0,jy:0,jv:0,hearts:3,score:0,ok:0,coins:0,qs,gates:0,nextGate:260,spawnZ:70,ents:[],t:0,flash:0,msg:null,msgT:0,end:0};
  qShown=-1;fit();mode='play';$('menu').hidden=true;$('res').hidden=true;$('hud').hidden=false;$('fb').innerHTML='';hud();
}
function spawn(){
  while(G.spawnZ<G.dist+FAR){
    const z=G.spawnZ;
    if(G.gates<G.qs.length&&z>=G.nextGate){G.ents.push({k:'gate',z:G.nextGate,qi:G.gates,sila:G.qs[G.gates][0]});G.gates++;G.nextGate+=GAP;G.spawnZ=G.nextGate-GAP+50;hud();continue}
    if(G.gates<G.qs.length&&z>G.nextGate-45){G.spawnZ=G.nextGate;continue}
    const l=Math.floor(Math.random()*3)-1;
    if(Math.random()<.5){G.ents.push({k:'bar',z,l});G.spawnZ+=30+Math.random()*15}
    else{for(let i=0;i<5;i++)G.ents.push({k:'coin',z:z+i*7,l});G.spawnZ+=50+Math.random()*20}
  }
}
function answer(e){
  const q=G.qs[e.qi],ok=G.lane+1===q[3];
  if(ok){G.ok++;G.score+=100;tune([660,880,1100]);G.msg={ok:1,t:'Benar! +100. '+q[4]}}
  else{G.hearts--;G.flash=.35;tune([220,160],'sawtooth');G.msg={ok:0,t:'Jawaban benar: '+LT[q[3]]+'. '+q[4]}}
  G.msgT=4;hud();if(G.hearts<=0)finish(true)
}
function update(dt){
  G.t+=dt;G.dist+=G.speed*dt;G.lx+=(G.lane-G.lx)*Math.min(1,dt*12);
  if(G.jy>0||G.jv>0){G.jv-=20*dt;G.jy=Math.max(0,G.jy+G.jv*dt);if(G.jy===0)G.jv=0}
  G.flash=Math.max(0,G.flash-dt);if(G.msgT>0){G.msgT-=dt;if(G.msgT<=0){G.msg=null;hud()}}
  spawn();
  for(const e of G.ents){if(e.done)continue;const d=e.z-G.dist;
    if(e.k==='coin'&&d<PD+2&&d>PD-3&&e.l===G.lane){e.done=1;G.score+=10;G.coins++;sfx(1200,.07,'sine',.06)}
    else if(e.k==='bar'&&d<PD+1.5&&d>PD-1.5&&e.l===G.lane&&G.jy<.5){e.done=1;G.hearts--;G.flash=.35;sfx(140,.25,'sawtooth',.1);hud();if(G.hearts<=0)finish(true)}
    else if(e.k==='gate'&&d<=PD){e.done=1;answer(e)}}
  G.ents=G.ents.filter(e=>!e.done&&e.z-G.dist>-5);
  if(mode==='play'&&G.gates>=G.qs.length&&!G.ents.some(e=>e.k==='gate')&&!G.end)G.end=G.t+2;
  if(mode==='play'&&G.end&&G.t>G.end)finish(false);
}
function hud(){
  $('sc').textContent='★ '+G.score;$('hp').textContent='❤'.repeat(Math.max(0,G.hearts))+'♡'.repeat(3-Math.max(0,G.hearts));
  const g=G.ents.find(e=>e.k==='gate'&&!e.done),n=g?g.qi+1:Math.min(G.gates,G.qs.length);
  $('pg').textContent='Soal '+n+'/'+G.qs.length;
  const id=g?g.qi:-1;
  if(id!==qShown){qShown=id;
    if(g){const q=G.qs[id];$('qc').hidden=false;$('qc').innerHTML='<b>Sila '+q[0]+'</b>'+q[1]+'<div class="op">'+q[2].map((o,i)=>'<span style="background:'+LC[i]+'"><b style="display:inline;color:#fff;font-size:.8rem">'+LT[i]+'.</b> '+o+'</span>').join('')+'</div>'}
    else $('qc').hidden=true}
  $('fb').innerHTML=G.msg?'<div class="fb '+(G.msg.ok?'ok':'no')+'">'+G.msg.t+'</div>':'';
}
function finish(over){
  mode='end';$('hud').hidden=true;const acc=G.ok/G.qs.length;
  const cat=acc>=.8?'Sangat Baik':acc>=.6?'Baik':acc>=.4?'Cukup':'Perlu Berlatih';
  if(G.score>best){best=G.score;try{localStorage.setItem('pancasilaRunBest',best)}catch(e){}}
  $('rT').textContent=over?'Nyawa habis!':'Lari selesai!';$('rS').textContent=G.score;
  $('rI').textContent='Benar '+G.ok+' dari '+G.qs.length+' soal, koin '+G.coins+'. Skor terbaik: '+best;
  $('rC').textContent='Kategori: '+cat;$('res').hidden=false;tune(over?[300,240,200]:[523,659,784,1047],over?'sawtooth':'square');
}
function jump(){if(mode==='play'&&G.jy===0){G.jv=7.5;G.jy=.001;sfx(520,.12,'triangle',.06)}}
function move(d){if(mode==='play'){G.lane=Math.max(-1,Math.min(1,G.lane+d));sfx(330,.05,'triangle',.05)}}
addEventListener('keydown',e=>{const k=e.code;if(['ArrowLeft','KeyA'].includes(k)){move(-1);e.preventDefault()}else if(['ArrowRight','KeyD'].includes(k)){move(1);e.preventDefault()}else if(['ArrowUp','KeyW','Space'].includes(k)&&e.target.tagName!=='BUTTON'){jump();e.preventDefault()}});
$('bL').onclick=()=>move(-1);$('bR').onclick=()=>move(1);$('bJ').onclick=jump;
let t0=null;cv.addEventListener('touchstart',e=>{t0=e.touches[0]},{passive:true});
cv.addEventListener('touchend',e=>{if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;if(Math.abs(dx)>25&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<-25)jump();t0=null},{passive:true});
$('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;diff=+b.dataset.i;[...$('seg').children].forEach(x=>x.classList.toggle('on',x===b))};
$('selSila').onchange=e=>sel=+e.target.value;
$('start').onclick=begin;$('again').onclick=begin;
$('toMenu').onclick=()=>{mode='menu';$('res').hidden=true;$('menu').hidden=false;$('bestTxt').textContent=best?'Skor terbaik: '+best:''};
$('bestTxt').textContent=best?'Skor terbaik: '+best:'';
function draw(){
  const hor=HOR(),sk=SK[(G&&G.ents.find(e=>e.k==='gate')||{}).sila||(G&&G.qs[Math.min(G.gates,G.qs.length)-1]||[0])[0]||0]||SK[0];
  const g=cx.createLinearGradient(0,0,0,hor);g.addColorStop(0,sk[0]);g.addColorStop(1,sk[1]);cx.fillStyle=g;cx.fillRect(0,0,W,hor+2);
  cx.fillStyle='rgba(30,80,90,.35)';for(let i=0;i<14;i++){const w=W/14,h=hs(i)*H*.12+H*.03;cx.fillRect(i*w,hor-h,w-2,h)}
  const D=G?G.dist:0;
  for(let y=hor;y<H;y+=3){const s=(y-hor)/(H-hor);if(s<.02)continue;const d=NEAR/s-NEAR,b=Math.floor((d+D)/12)%2,rw=W*.6*s;
    cx.fillStyle=b?'#3f9b57':'#47a862';cx.fillRect(0,y,W,3);
    cx.fillStyle='#e9a23b';cx.fillRect(W/2-rw-Math.max(2,9*s),y,2*rw+2*Math.max(2,9*s),3);
    cx.fillStyle=b?'#4b5560':'#434c56';cx.fillRect(W/2-rw,y,2*rw,3);
    if(b){cx.fillStyle='#f5f0dc';const lw=Math.max(1,3*s);cx.fillRect(W/2-rw/3-lw/2,y,lw,3);cx.fillRect(W/2+rw/3-lw/2,y,lw,3)}}
  const bc=['#e8702a','#2fa8b8','#f2b705','#c45a8a','#6a8ee8'];
  for(let k=14;k>=0;k--){const idx=Math.floor(D/30)+k,d=idx*30-D;if(d<=1||d>FAR)continue;const s=sc(d),gb=gy(s),rw=W*.6*s;
    for(const sd of[-1,1]){const h=(hs(idx+sd*7)*5+3)*W*.075*s,bw=W*.33*s,x=sd<0?W/2-rw*1.2-bw:W/2+rw*1.2;
      cx.fillStyle=bc[Math.floor(hs(idx*3+sd)*5)];cx.fillRect(x,gb-h,bw,h);cx.fillStyle='rgba(255,255,255,.25)';cx.fillRect(x,gb-h,bw,Math.max(2,h*.08));
      if(idx%3===0&&s>.1){cx.font=Math.round(W*.16*s)+'px serif';cx.textAlign='center';cx.fillText(idx%6===0?'🌴':'🏯',sd<0?x-W*.06*s:x+bw+W*.06*s,gb)}}}
  if(!G)return;
  const ps=sc(PD),fx=lx(G.lx,ps),gp=gy(ps),u=W*.22*ps,list=G.ents.slice().sort((a,b)=>b.z-a.z);
  for(const e of list)ent(e);
  const y0=gp-G.jy*u*.8,sw=Math.sin(G.t*14)*(G.jy>0?.25:1);
  cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.ellipse(fx,gp,u*.18,u*.05,0,0,7);cx.fill();
  cx.lineCap='round';cx.strokeStyle='#7a4a2a';cx.lineWidth=u*.07;
  cx.beginPath();cx.moveTo(fx-u*.04,y0-u*.4);cx.lineTo(fx-u*.04+sw*u*.14,y0);cx.moveTo(fx+u*.04,y0-u*.4);cx.lineTo(fx+u*.04-sw*u*.14,y0);cx.stroke();
  cx.strokeStyle='#f1c59b';cx.lineWidth=u*.055;cx.beginPath();cx.moveTo(fx-u*.1,y0-u*.68);cx.lineTo(fx-u*.14-sw*u*.1,y0-u*.45);cx.moveTo(fx+u*.1,y0-u*.68);cx.lineTo(fx+u*.14+sw*u*.1,y0-u*.45);cx.stroke();
  cx.fillStyle='#e8702a';cx.beginPath();cx.roundRect(fx-u*.11,y0-u*.74,u*.22,u*.36,u*.05);cx.fill();cx.fillStyle='#2f9e5b';cx.fillRect(fx-u*.11,y0-u*.52,u*.22,u*.05);
  cx.fillStyle='#1b1b1b';cx.beginPath();cx.ellipse(fx,y0-u*.84,u*.115,u*.125,0,0,7);cx.fill();
  cx.fillStyle='#f1c59b';cx.beginPath();cx.arc(fx,y0-u*.82,u*.095,0,7);cx.fill();
  cx.fillStyle='#f2b705';cx.beginPath();cx.arc(fx-u*.08,y0-u*.93,u*.035,0,7);cx.fill();
  if(G.flash>0){cx.fillStyle='rgba(255,60,60,'+G.flash+')';cx.fillRect(0,0,W,H)}
}
function ent(e){
  const d=e.z-G.dist;if(d>FAR||d<-4)return;const s=sc(d),b=gy(s),ls=W*.6*s*2/3;
  if(e.k==='coin'){const x=lx(e.l,s),r=W*.03*s,w=Math.abs(Math.cos(G.t*5+e.z))*r+r*.2;cx.fillStyle='#ffc233';cx.beginPath();cx.ellipse(x,b-W*.06*s,w,r,0,0,7);cx.fill();cx.strokeStyle='#b57d00';cx.lineWidth=Math.max(1,s*2);cx.stroke()}
  else if(e.k==='bar'){const x=lx(e.l,s),w=ls*.8,h=W*.075*s;cx.fillStyle='#c93c3c';cx.fillRect(x-w/2,b-h,w,h);cx.fillStyle='#fff';for(let i=0;i<4;i++)cx.fillRect(x-w/2+w*(i*.25+.05),b-h,w*.1,h);cx.fillStyle='#222';cx.fillRect(x-w/2,b,w*.08,h*.2);cx.fillRect(x+w*.42,b,w*.08,h*.2)}
  else{const h=W*.34*s;for(let l=-1;l<=1;l++){const x=lx(l,s);cx.fillStyle=LC[l+1];cx.globalAlpha=.92;cx.fillRect(x-ls*.42,b-h,ls*.84,h);cx.globalAlpha=1;cx.fillStyle='#fff';cx.font='800 '+Math.max(6,Math.round(h*.55))+'px Baloo 2,sans-serif';cx.textAlign='center';cx.fillText(LT[l+1],x,b-h*.32)}
    const bh=W*.055*s;cx.fillStyle='#10353a';cx.fillRect(W/2-ls*1.5,b-h-bh,ls*3,bh);cx.fillStyle='#ffc233';cx.font='800 '+Math.max(6,Math.round(bh*.7))+'px Baloo 2,sans-serif';cx.fillText('GERBANG SOAL',W/2,b-h-bh*.22)}
}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(mode==='play'){update(dt)}draw();requestAnimationFrame(loop)}
fit();requestAnimationFrame(loop);
</script>
